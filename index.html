<style>
:root{--bg:#f6f2ea;--card:#fff;--tx:#1c1830;--mu:#6b6578;--pu:#5b2a86;--go:#b8892f;--bd:#ddd5c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101c;--card:#1c1930;--tx:#efeaf7;--mu:#a59db8;--pu:#b794e6;--bd:#352f4d}}
:root[data-theme="dark"]{--bg:#12101c;--card:#1c1930;--tx:#efeaf7;--mu:#a59db8;--pu:#b794e6;--bd:#352f4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#1a1430,#3d1d5e);color:#fff;border-bottom:3px solid var(--go)}
header img{width:56px;height:56px;border-radius:50%;border:2px solid var(--go)}
header b{display:block;font-size:18px;letter-spacing:.5px}header span{font-size:12px;color:#e6c98a}
nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav button.on{color:var(--pu);border-color:var(--go)}
main{padding:14px 16px 40px;max-width:760px;margin:auto}section{display:none}section.on{display:block}
label{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--pu);color:#fff;font-weight:700;font-size:16px}
.btn.g{background:var(--go)}.btn.o{background:none;color:var(--pu);border:1px solid var(--pu)}.btn:disabled{opacity:.5}
.f{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.f small{color:var(--mu)}.f button{border:0;background:none;color:#c0392b;font-size:20px}
.hint{color:var(--mu);font-size:13px}#hasil{min-height:360px;font:15px/1.5 Georgia,"Times New Roman",serif}

<script>
/* Penghubung APK: menggantikan window.claude (khusus claude.ai) dengan API Claude + unduhan Android */
(function(){
if(window.claude&&window.claude.use)return;
function key(){let k=null;try{k=localStorage.getItem('lbh_api_key')}catch(e){}
 if(k)return Promise.resolve(k);
 return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif';
 o.innerHTML='<div style="background:#fff;color:#222;padding:22px;border-radius:12px;max-width:420px;width:90%"><h3 style="margin:0 0 8px">API Key Claude</h3><p style="font-size:13px;margin:0 0 10px">Masukkan API Key (sk-ant-...) dari console.anthropic.com untuk mengaktifkan asisten AI. Tersimpan hanya di komputer ini.</p><input id="lbhk" type="password" style="width:100%;padding:9px;box-sizing:border-box;margin-bottom:12px"><div style="text-align:right"><button id="lbhx" style="padding:8px 14px;margin-right:6px">Batal</button><button id="lbhs" style="padding:8px 14px;background:#4b2a7b;color:#fff;border:0;border-radius:6px">Simpan</button></div></div>';
 document.body.appendChild(o);
 o.querySelector('#lbhx').onclick=()=>{o.remove();res(null)};
 o.querySelector('#lbhs').onclick=()=>{const v=o.querySelector('#lbhk').value.trim();if(v){try{localStorage.setItem('lbh_api_key',v)}catch(e){}}o.remove();res(v||null)}})}
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function sample(prompt,o){o=o||{};const k=await key();if(!k)throw new Error('API Key belum diisi');
 const content=[];
 for(const im of (o.images||[])){content.push({type:'image',source:{type:'base64',media_type:im.type||'image/jpeg',data:await b64(im)}})}
 content.push({type:'text',text:prompt});
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:8000,messages:[{role:'user',content}]})});
 const d=await r.json();
 if(!r.ok){if(r.status===401){try{localStorage.removeItem('lbh_api_key')}catch(e){}}throw new Error((d.error&&d.error.message)||('HTTP '+r.status))}
 const text=(d.content||[]).map(c=>c.text||'').join('');
 if(o.onText)o.onText({text});
 return {text,truncated:d.stop_reason==='max_tokens'}}
sample.limits=async()=>({images:true});
const downloads={async save({filename,data}){
 const C=window.Capacitor,P=C&&C.Plugins;
 if(P&&P.Filesystem&&P.Share){const b=await b64(data);
  const f=await P.Filesystem.writeFile({path:filename,data:b,directory:'CACHE'});
  await P.Share.share({title:filename,url:f.uri,dialogTitle:'Simpan / bagikan dokumen'});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
window.claude={use:async n=>n==='sample'?sample:n==='downloads'?downloads:null};
})();
</script>

function prompt(){const v=k=>$(k).value.trim()||'(tidak diisi)';
let p=`Anda adalah advokat senior Indonesia (>25 tahun) di LBH Jalapaksi. Susun dokumen hukum profesional sesuai kaidah hukum Indonesia, bahasa Indonesia baku-formal, siap tanda tangan.

JENIS DOKUMEN: ${$('jenis').value}
TUGAS: ${v('tugas')}
KLIEN: ${v('klien')}
PIHAK LAWAN: ${v('lawan')}
POKOK PERKARA: ${v('perkara')}
KRONOLOGI: ${v('kronologi')}
DASAR HUKUM DIKETAHUI: ${v('dasar')}
TUJUAN/PETITUM: ${v('tujuan')}

KOTA & TANGGAL: ${v('kota')}
ADVOKAT: ${v('advokat')}`;

function runs(t,o){return t.split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(x=>x.startsWith('**')&&x.endsWith('**')?new docx.TextRun({text:x.slice(2,-2),bold:true,...o}):new docx.TextRun({text:x,...o}))}
async function dl(){const t=$('hasil').value.trim();if(!t){$('st2').textContent='Belum ada hasil.';return}
try{const A=docx.AlignmentType,P=[];
try{const bin=Uint8Array.from(atob(LOGO),c=>c.charCodeAt(0));P.push(new docx.Paragraph({alignment:A.CENTER,children:[new docx.ImageRun({data:bin,transformation:{width:70,height:70}})]}))}catch(e){}
P.push(new docx.Paragraph({alignment:A.CENTER,children:[new docx.TextRun({text:'LBH JALAPAKSI',bold:true,size:30})]}),new docx.Paragraph({alignment:A.CENTER,border:{bottom:{style:docx.BorderStyle.DOUBLE,size:6,color:'000000',space:4}},spacing:{after:240},children:[new docx.TextRun({text:'ADVOKAT & KONSULTAN HUKUM',size:22})]}));
for(const l of t.split('\n')){const s=l.trim();if(!s||/^-{3,}$/.test(s))continue;
if(s.startsWith('# '))P.push(new docx.Paragraph({alignment:A.CENTER,spacing:{before:120,after:160},children:runs(s.slice(2),{bold:true,size:26})}));
else if(s.startsWith('## '))P.push(new docx.Paragraph({spacing:{before:200,after:80},keepNext:true,children:runs(s.slice(3),{bold:true})}));
else if(/^[-*] /.test(s))P.push(new docx.Paragraph({alignment:A.JUSTIFIED,indent:{left:567,hanging:284},spacing:{after:60},children:runs('•  '+s.slice(2),{})}));
